name: Deploy to production

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  STACK: clay-humane-events
  IMAGE: ghcr.io/dream-encode/clay-humane-events
  TAG: ${{ github.event.release.tag_name || github.ref_name }}
  DEPLOY_HOST: 100.78.33.116

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.IMAGE }}-api:${{ env.TAG }}
            ${{ env.IMAGE }}-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.IMAGE }}-web:${{ env.TAG }}
            ${{ env.IMAGE }}-web:latest
          build-args: |
            VITE_API_URL=https://api.clayhumaneevents.com
            VITE_BASE_URL=https://clayhumaneevents.com
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Check out the infrastructure repository
        uses: actions/checkout@v7
        with:
          repository: dream-encode/infrastructure
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infrastructure

      - name: Record the release in the infrastructure repository
        working-directory: infrastructure
        run: |
          echo "IMAGE_TAG=$TAG" > "stacks/$STACK/release.env"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "stacks/$STACK/release.env"

          if git diff --cached --quiet; then
              echo "release.env already at $TAG"
              exit 0
          fi

          git commit -m "Deploy $STACK $TAG"

          for attempt in 1 2 3; do
              if git push; then
                  exit 0
              fi

              git pull --rebase --quiet
          done

          exit 1

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}

      - name: Deploy the stack
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "deploy@$DEPLOY_HOST" deploy "$STACK"

      - name: Check the site and API are up
        run: |
          set -euo pipefail

          for attempt in $( seq 1 12 ); do
            web=$( curl -s -o /dev/null -w '%{http_code}' --max-time 10 --resolve "clayhumaneevents.com:443:$DEPLOY_HOST" https://clayhumaneevents.com/ || true )
            api=$( curl -s -o /dev/null -w '%{http_code}' --max-time 10 --resolve "api.clayhumaneevents.com:443:$DEPLOY_HOST" https://api.clayhumaneevents.com/ || true )

            if [ "$web" = "200" ] && [ "$api" != "000" ] && [ "$api" -lt 500 ]; then
              echo "web $web, api $api"
              exit 0
            fi

            sleep 5
          done

          echo "web $web, api $api"
          exit 1
